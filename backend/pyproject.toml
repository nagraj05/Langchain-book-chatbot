[project]
name = "local-library-ai-backend"
version = "0.1.0"
description = "Local ebook ingestion and grounded question answering API"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "ebooklib>=0.19,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-ollama>=1.0,<2",
  "langchain-qdrant>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "pymupdf>=1.26,<2",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.15,<2",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]

